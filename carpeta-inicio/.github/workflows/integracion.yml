name: Integracion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integracion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Ejecutar golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: ./...

  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Descargar dependencias
        run: go mod download
      - name: Verificar compilacion
        run: go build ./...
      - name: Analisis estatico
        run: go vet ./...
      - name: Pruebas unitarias, de manejadores e integracion
        run: go test ./...
        env:
          BASE_DATOS_URL: postgres://asistencia:cambiar_esta_clave@localhost:5433/asistencia?sslmode=disable
          CLAVE_SESION: clave-de-sesion-de-pruebas-1234567890

  imagen:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: [lint, pruebas]
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t asistencia:${{ github.sha }} .
